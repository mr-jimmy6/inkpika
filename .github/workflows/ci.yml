name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: sh scripts/check.sh
      - run: sh scripts/build.sh
      - name: Read package version
        id: package
        run: echo "version=$(cat internal/buildinfo/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: inkpika-${{ steps.package.outputs.version }}-armv5
          path: |
            dist/inkpika-${{ steps.package.outputs.version }}-armv5.zip
            dist/inkpika-${{ steps.package.outputs.version }}-armv5.zip.sha256
          if-no-files-found: error
