<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wireless transfer · InkPika</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="page"><header class="heading"><h1>Wireless transfer</h1><button id="refresh">Refresh</button></header>
<span id="title" class="visually-hidden">Connecting…</span><p id="description" hidden></p>
<p id="message" class="connection-state" role="status">Loading connection info…</p>
<section id="connection" hidden>
<div class="connection-network"><span>Current Wi-Fi</span>: <strong id="wifi"></strong><span id="ip" hidden></span></div>
<label id="network-choice" hidden>Network address <select id="network"></select></label>
<div class="connect-guide"><div class="qr"><img id="qr" width="260" height="260" alt="Pairing QR code"><p class="note">Phone: scan to connect</p></div><div class="guide">
<p class="guide-title">Computer: open this address</p><p id="endpoint" class="endpoint"></p>
<p class="code-label">Connection code</p><p id="code" class="code"></p>
</div></div>
<p class="note">Use the same Wi-Fi and keep Kindle awake.</p>
<p class="note service-help"><span>To stop: KUAL → InkPika → Background services → </span><span id="stop-label"></span></p>
</section>
<footer class="app-footer"><span class="footer-brand">InkPika · @BUILD_VERSION@</span><span class="footer-build"><span>Built (UTC)</span>: <span>@BUILD_TIME@</span></span></footer></div><script src="/i18n.js"></script><script src="/app.js"></script></body></html>
