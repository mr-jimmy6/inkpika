<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="InkPika 使用流程"><title>InkPika 使用流程</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="580" rx="24" fill="#f5f8f2" stroke="#f5f8f2"/><text x="42" y="65" font-size="38" font-weight="700" fill="#243c40">InkPika</text><text x="42" y="109" font-size="25" font-weight="400" fill="#243c40">两种日常用法</text><text x="42" y="171" font-size="26" font-weight="700" fill="#243c40">手机直接传书</text><rect x="42" y="193" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="58" y="235" font-size="18" font-weight="600" fill="#243c40">手机 / 电脑</text><text x="306" y="236" font-size="23" font-weight="400" fill="#243c40">→</text><rect x="328" y="193" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="344" y="235" font-size="18" font-weight="600" fill="#243c40">同一 Wi-Fi 配对</text><text x="592" y="236" font-size="23" font-weight="400" fill="#243c40">→</text><rect x="614" y="193" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="630" y="235" font-size="18" font-weight="600" fill="#243c40">上传电子书</text><text x="878" y="236" font-size="23" font-weight="400" fill="#243c40">→</text><rect x="900" y="193" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="916" y="235" font-size="18" font-weight="600" fill="#243c40">Kindle 原生阅读</text><text x="42" y="298" font-size="20" font-weight="400" fill="#243c40">无需云账号；也可从 Kindle 导出图书。</text><text x="42" y="364" font-size="26" font-weight="700" fill="#243c40">准备书单，云端取书</text><rect x="42" y="386" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="58" y="428" font-size="18" font-weight="600" fill="#243c40">自己的外部工具</text><text x="306" y="429" font-size="23" font-weight="400" fill="#243c40">→</text><rect x="328" y="386" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="344" y="428" font-size="18" font-weight="600" fill="#243c40">上传到对象存储</text><text x="592" y="429" font-size="23" font-weight="400" fill="#243c40">→</text><rect x="614" y="386" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="630" y="428" font-size="18" font-weight="600" fill="#243c40">InkPika 下载 / 同步</text><text x="878" y="429" font-size="23" font-weight="400" fill="#243c40">→</text><rect x="900" y="386" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="916" y="428" font-size="18" font-weight="600" fill="#243c40">Kindle 原生阅读</text><text x="42" y="491" font-size="20" font-weight="400" fill="#243c40">翻译、制书和云端上传由外部工具完成。</text><text x="42" y="553" font-size="17" font-weight="400" fill="#243c40">流程示意 · 配对请使用设备当前显示的二维码</text></g></svg>
