<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="InkPika · Transfer books over Wi-Fi. Download from your own cloud."><title>InkPika · Transfer books over Wi-Fi. Download from your own cloud.</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="650" rx="24" fill="#f5f8f2" stroke="#f5f8f2"/><text x="42" y="70" font-size="42" font-weight="700" fill="#243c40">InkPika</text><text x="42" y="114" font-size="24" font-weight="400" fill="#243c40">Transfer books over Wi-Fi. Download from your own cloud.</text><rect x="42" y="156" width="542" height="183" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="68" y="199" font-size="19" font-weight="700" fill="#4c7561">01</text><text x="117" y="199" font-size="25" font-weight="700" fill="#243c40">Wireless transfer</text><text x="68" y="249" font-size="23" font-weight="400" fill="#243c40">Phone / computer ↔ Kindle</text><text x="68" y="293" font-size="20" font-weight="400" fill="#243c40">Same Wi-Fi. Pair with a QR or code.</text><rect x="616" y="156" width="542" height="183" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="642" y="199" font-size="19" font-weight="700" fill="#4c7561">02</text><text x="691" y="199" font-size="25" font-weight="700" fill="#243c40">Your own cloud library</text><text x="642" y="249" font-size="23" font-weight="400" fill="#243c40">OSS · QingStor · S3 · Azure Blob</text><text x="642" y="293" font-size="20" font-weight="400" fill="#243c40">KUAL sync or individual downloads.</text><rect x="42" y="363" width="542" height="183" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="68" y="406" font-size="19" font-weight="700" fill="#4c7561">03</text><text x="117" y="406" font-size="25" font-weight="700" fill="#243c40">Configure on a larger screen</text><text x="68" y="456" font-size="23" font-weight="400" fill="#243c40">Open on Kindle → phone / computer</text><text x="68" y="500" font-size="20" font-weight="400" fill="#243c40">Pair to edit. Saved keys stay masked.</text><rect x="616" y="363" width="542" height="183" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="642" y="406" font-size="19" font-weight="700" fill="#4c7561">04</text><text x="691" y="406" font-size="25" font-weight="700" fill="#243c40">Native reading</text><text x="642" y="456" font-size="23" font-weight="400" fill="#243c40">Save → system indexing → read</text><text x="642" y="500" font-size="20" font-weight="400" fill="#243c40">Native-compatible files. No conversion.</text><text x="42" y="614" font-size="18" font-weight="400" fill="#243c40">Feature illustration · Jailbreak + KUAL required</text></g></svg>
