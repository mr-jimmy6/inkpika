<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="InkPika workflows"><title>InkPika workflows</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="580" rx="24" fill="#f5f8f2" stroke="#f5f8f2"/><text x="42" y="65" font-size="38" font-weight="700" fill="#243c40">InkPika</text><text x="42" y="109" font-size="25" font-weight="400" fill="#243c40">Two everyday workflows</text><text x="42" y="171" font-size="26" font-weight="700" fill="#243c40">Send a book you have</text><rect x="42" y="193" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="58" y="235" font-size="18" font-weight="600" fill="#243c40">Phone / computer</text><text x="306" y="236" font-size="23" font-weight="400" fill="#243c40">→</text><rect x="328" y="193" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="344" y="235" font-size="18" font-weight="600" fill="#243c40">Pair on Wi-Fi</text><text x="592" y="236" font-size="23" font-weight="400" fill="#243c40">→</text><rect x="614" y="193" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="630" y="235" font-size="18" font-weight="600" fill="#243c40">Upload ebooks</text><text x="878" y="236" font-size="23" font-weight="400" fill="#243c40">→</text><rect x="900" y="193" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="916" y="235" font-size="18" font-weight="600" fill="#243c40">Read on Kindle</text><text x="42" y="298" font-size="20" font-weight="400" fill="#243c40">No cloud account. Export books from Kindle too.</text><text x="42" y="364" font-size="26" font-weight="700" fill="#243c40">Prepare a cloud reading list</text><rect x="42" y="386" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="58" y="428" font-size="18" font-weight="600" fill="#243c40">Your external tools</text><text x="306" y="429" font-size="23" font-weight="400" fill="#243c40">→</text><rect x="328" y="386" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="344" y="428" font-size="18" font-weight="600" fill="#243c40">Your object storage</text><text x="592" y="429" font-size="23" font-weight="400" fill="#243c40">→</text><rect x="614" y="386" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="630" y="428" font-size="18" font-weight="600" fill="#243c40">InkPika download / sync</text><text x="878" y="429" font-size="23" font-weight="400" fill="#243c40">→</text><rect x="900" y="386" width="258" height="68" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="916" y="428" font-size="18" font-weight="600" fill="#243c40">Read on Kindle</text><text x="42" y="491" font-size="20" font-weight="400" fill="#243c40">External tools handle translation, ebook creation and cloud uploads.</text><text x="42" y="553" font-size="17" font-weight="400" fill="#243c40">Workflow illustration · Pair using the QR code currently displayed on your device</text></g></svg>
