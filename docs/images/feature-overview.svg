<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="InkPika · 无线直传，云端取书。"><title>InkPika · 无线直传，云端取书。</title><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="650" rx="24" fill="#f5f8f2" stroke="#f5f8f2"/><text x="42" y="70" font-size="42" font-weight="700" fill="#243c40">InkPika</text><text x="42" y="114" font-size="24" font-weight="400" fill="#243c40">无线直传，云端取书。</text><rect x="42" y="156" width="542" height="183" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="68" y="199" font-size="19" font-weight="700" fill="#4c7561">01</text><text x="117" y="199" font-size="25" font-weight="700" fill="#243c40">无线双向传书</text><text x="68" y="249" font-size="23" font-weight="400" fill="#243c40">手机 / 电脑 ↔ Kindle</text><text x="68" y="293" font-size="20" font-weight="400" fill="#243c40">同一 Wi-Fi，扫码或连接码配对</text><rect x="616" y="156" width="542" height="183" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="642" y="199" font-size="19" font-weight="700" fill="#4c7561">02</text><text x="691" y="199" font-size="25" font-weight="700" fill="#243c40">自己的云端书库</text><text x="642" y="249" font-size="23" font-weight="400" fill="#243c40">OSS · QingStor · S3 · Azure Blob</text><text x="642" y="293" font-size="20" font-weight="400" fill="#243c40">KUAL 同步，或浏览书架按需下载</text><rect x="42" y="363" width="542" height="183" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="68" y="406" font-size="19" font-weight="700" fill="#4c7561">03</text><text x="117" y="406" font-size="25" font-weight="700" fill="#243c40">大屏配置</text><text x="68" y="456" font-size="23" font-weight="400" fill="#243c40">Kindle 打开入口 → 手机 / 电脑</text><text x="68" y="500" font-size="20" font-weight="400" fill="#243c40">配对后编辑，保存的密钥脱敏显示</text><rect x="616" y="363" width="542" height="183" rx="18" fill="#fff" stroke="#d5e1dc"/><text x="642" y="406" font-size="19" font-weight="700" fill="#4c7561">04</text><text x="691" y="406" font-size="25" font-weight="700" fill="#243c40">原生阅读</text><text x="642" y="456" font-size="23" font-weight="400" fill="#243c40">保存图书 → 系统索引 → 打开</text><text x="642" y="500" font-size="20" font-weight="400" fill="#243c40">使用设备原生支持的格式，不转换文件</text><text x="42" y="614" font-size="18" font-weight="400" fill="#243c40">功能示意 · 需越狱与 KUAL</text></g></svg>
